# T342: eprintln!/eprint! panic on EAGAIN when stderr is a full non-blocking pipe (`log stderr`
# makes fd 2 O_NONBLOCK, and a reloaded process inherits it); the crash hook then aborts.
# Use alcyon_rt::stderr_line! (alcyon-rt) or alcyon_config::stderr_line! (alcyon-config, alcyon-tls).
# Test crates allow it at their root.
disallowed-macros = [
    { path = "std::eprintln", reason = "panics on a full non-blocking stderr; use stderr_line!" },
    { path = "std::eprint", reason = "panics on a full non-blocking stderr; use stderr_line!" },
]
