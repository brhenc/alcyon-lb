global
   strict-limits
   nbthread 1
   maxconn 10000
defaults
   mode http
   balance random
   timeout client 60s
   timeout server 60s
   timeout connect 1s
listen p
   bind 127.0.0.1:18000
   server s0 127.0.0.1:18100
   server s1 127.0.0.1:18101
   server s2 127.0.0.1:18102
   server s3 127.0.0.1:18103
   server s4 127.0.0.1:18104
   server s5 127.0.0.1:18105
   server s6 127.0.0.1:18106
   server s7 127.0.0.1:18107
