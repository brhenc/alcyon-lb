# Same file for Alcyon and HAProxy. run.sh replaces @PROXY_PORT@ and @APP_PORT@.
global
    maxconn 1000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout tunnel  1h
    option http-keep-alive

frontend fe
    bind 127.0.0.1:@PROXY_PORT@
    default_backend be

backend be
    server node1 127.0.0.1:@APP_PORT@
