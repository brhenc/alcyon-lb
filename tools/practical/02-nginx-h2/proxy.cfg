# Same file for Ibex and HAProxy. run.sh replaces the @...@ words.
global
    maxconn 2000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option http-keep-alive
    option forwardfor

frontend fe
    bind 127.0.0.1:@PROXY_PORT@ ssl crt @CERT@ alpn h2,http/1.1
    use_backend static if { path_beg /static/ }
    default_backend dyn

backend dyn
    server nginx_dyn 127.0.0.1:@NGX_DYN_PORT@

backend static
    server nginx_static 127.0.0.1:@NGX_STATIC_PORT@
