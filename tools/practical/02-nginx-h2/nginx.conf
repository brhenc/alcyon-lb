# run.sh replaces the @...@ words. Everything lives under @WORK@ (unprivileged).
daemon off;
pid @WORK@/nginx.pid;
error_log @WORK@/nginx-error.log notice;
events { worker_connections 1024; }
http {
    access_log @WORK@/nginx-access.log;
    client_body_temp_path @WORK@/tmp/client_body;
    proxy_temp_path       @WORK@/tmp/proxy;
    fastcgi_temp_path     @WORK@/tmp/fastcgi;
    uwsgi_temp_path       @WORK@/tmp/uwsgi;
    scgi_temp_path        @WORK@/tmp/scgi;
    include /etc/nginx/mime.types;
    client_max_body_size 0;
    keepalive_requests 100000;

    # nginx as a proxy to node.js
    server {
        listen 127.0.0.1:@NGX_DYN_PORT@;
        location / {
            proxy_pass http://127.0.0.1:@APP_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_request_buffering off;
        }
    }
    # nginx as a static-file server: /static/x -> @WORK@/static/x
    server {
        listen 127.0.0.1:@NGX_STATIC_PORT@;
        root @WORK@;
        location /static/ { }
    }
}
