# Same file for Ibex and HAProxy. run.sh replaces @PROXY_PORT@ and @HTTPD_PORT@.
global
    maxconn 1000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  10s
    timeout tunnel  1h
    option http-keep-alive
    option forwardfor

frontend fe
    bind 127.0.0.1:@PROXY_PORT@
    acl is_direct path_beg /static/ /cgi-bin/
    use_backend direct if is_direct
    default_backend app

backend direct
    server httpd 127.0.0.1:@HTTPD_PORT@

backend app
    server httpd 127.0.0.1:@HTTPD_PORT@
