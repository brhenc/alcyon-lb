# Minimal unprivileged httpd. run.sh replaces @WORK@, @HERE@, @HTTPD_PORT@, @NODE_PORT@, @MODS@.
ServerRoot "@WORK@"
ServerName localhost
Listen 127.0.0.1:@HTTPD_PORT@
PidFile "@WORK@/httpd.pid"
DefaultRuntimeDir "@WORK@/run"
ScriptSock "@WORK@/run/cgisock"
ErrorLog "@WORK@/httpd-error.log"
LogLevel warn
LoadModule mpm_event_module @MODS@/mod_mpm_event.so
LoadModule unixd_module @MODS@/mod_unixd.so
LoadModule authz_core_module @MODS@/mod_authz_core.so
LoadModule mime_module @MODS@/mod_mime.so
LoadModule alias_module @MODS@/mod_alias.so
LoadModule proxy_module @MODS@/mod_proxy.so
LoadModule proxy_http_module @MODS@/mod_proxy_http.so
LoadModule cgid_module @MODS@/mod_cgid.so

TypesConfig /etc/mime.types
Timeout 30
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 15
ServerLimit 4
StartServers 2
ThreadsPerChild 25
MaxRequestWorkers 100

<Directory />
    Require all denied
</Directory>

Alias /static/ "@WORK@/htdocs/static/"
<Directory "@WORK@/htdocs/static">
    Require all granted
</Directory>

ScriptAlias /cgi-bin/ "@HERE@/cgi-bin/"
<Directory "@HERE@/cgi-bin">
    Require all granted
</Directory>

ProxyRequests Off
ProxyPass /static/ !
ProxyPass /cgi-bin/ !
ProxyPass / http://127.0.0.1:@NODE_PORT@/
ProxyPassReverse / http://127.0.0.1:@NODE_PORT@/
