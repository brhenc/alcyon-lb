# Same file for Alcyon and HAProxy. run.sh replaces @PROXY_PORT@, @STICKY_PORT@,
# @APP_PORT1@..@APP_PORT3@ and @SOCK@.
global
    maxconn 1000
    stats socket @SOCK@ mode 600 level admin

defaults
    mode http
    timeout connect 1s
    timeout client  30s
    timeout server  30s
    option http-keep-alive
    retries 3
    option redispatch 1

frontend fe
    bind 127.0.0.1:@PROXY_PORT@
    default_backend be

frontend fe_sticky
    bind 127.0.0.1:@STICKY_PORT@
    default_backend be_sticky

backend be
    balance roundrobin
    option httpchk GET /health
    default-server inter 500ms fall 2 rise 2
    server n1 127.0.0.1:@APP_PORT1@ check
    server n2 127.0.0.1:@APP_PORT2@ check
    server n3 127.0.0.1:@APP_PORT3@ check

backend be_sticky
    balance roundrobin
    option httpchk GET /health
    cookie SRV insert indirect nocache
    default-server inter 500ms fall 2 rise 2
    server n1 127.0.0.1:@APP_PORT1@ check cookie n1
    server n2 127.0.0.1:@APP_PORT2@ check cookie n2
    server n3 127.0.0.1:@APP_PORT3@ check cookie n3
