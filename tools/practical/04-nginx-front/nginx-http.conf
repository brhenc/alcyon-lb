# Fallback used by run.sh when the nginx stream module is not installed: nginx as an h1
# reverse proxy that builds the X-Forwarded-For chain itself (no PROXY protocol).
daemon off;
pid @WORK@/nginx.pid;
error_log @WORK@/nginx-error.log notice;
events { worker_connections 1024; }
http {
    access_log @WORK@/nginx-access.log;
    client_body_temp_path @WORK@/tmp/client_body;
    proxy_temp_path       @WORK@/tmp/proxy;
    fastcgi_temp_path     @WORK@/tmp/fastcgi;
    uwsgi_temp_path       @WORK@/tmp/uwsgi;
    scgi_temp_path        @WORK@/tmp/scgi;
    client_max_body_size 0;
    keepalive_requests 100000;
    map $http_upgrade $conn_up { default upgrade; '' ""; }
    server {
        listen 127.0.0.1:@NGX_PORT@;
        location / {
            proxy_pass http://127.0.0.1:@PLAIN_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conn_up;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
