# Same file for Ibex and HAProxy. run.sh replaces the @...@ words.
global
    maxconn 1000
    log stdout format raw daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout tunnel  1h
    option http-keep-alive
    option forwardfor

frontend fe
    bind 127.0.0.1:@PLAIN_PORT@
    bind 127.0.0.1:@PP_PORT@ accept-proxy
    default_backend be

backend be
    server node1 127.0.0.1:@APP_PORT@
