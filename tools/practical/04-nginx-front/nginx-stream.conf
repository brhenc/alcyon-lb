#
# nginx's http module cannot send the PROXY protocol to an upstream; the stream module can.
# The stream module is a dynamic module (package nginx-mod-stream).
# run.sh replaces the @...@ words. Unprivileged: everything under @WORK@.
daemon off;
pid @WORK@/nginx.pid;
error_log @WORK@/nginx-error.log notice;
load_module @STREAM_MODULE@;
events { worker_connections 1024; }
stream {
    server {
        listen 127.0.0.1:@NGX_PORT@;
        proxy_pass 127.0.0.1:@PP_PORT@;
        proxy_protocol on;
    }
}
