# Training configuration for tools/pgo-build.sh. Words between @ are replaced by the script.
# Every keyword here is accepted by haproxy -c and by ibex.
global
    nbthread 1
    maxconn 2000
    log 127.0.0.1:@P_LOG@ format rfc3164 local0

defaults
    mode http
    log global
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r"
    timeout connect 2s
    timeout client  10s
    timeout server  10s

# Plain HTTP/1, rules, error paths.
frontend fe_h1
    bind 127.0.0.1:@P_H1@
    option forwardfor
    http-request set-header X-Trained yes
    http-request set-header X-Req-Path %[path]
    http-request del-header X-Debug
    http-request return status 404 content-type text/plain string "not found" if { path_beg /missing }
    http-request deny deny_status 403 if { path_reg ^/private/[0-9]+$ }
    http-request redirect location /moved code 302 if { path /old }
    http-response set-header X-Served-By ibex
    http-response del-header Server
    use_backend be_down if { path_beg /down }
    default_backend be

# TLS with ALPN h2 and http/1.1.
frontend fe_tls
    bind 127.0.0.1:@P_TLS@ ssl crt @CERT@ alpn h2,http/1.1
    http-request set-header X-Trained yes
    http-request redirect location /moved code 302 if { path /old }
    http-response set-header X-Served-By ibex
    default_backend be

# HTTP/3 over QUIC (UDP), to the same backend.
frontend fe_h3
    bind quic4@127.0.0.1:@P_H3@ ssl crt @CERT@ alpn h3
    http-request set-header X-Trained yes
    http-request redirect location /moved code 302 if { path /old }
    http-response set-header X-Served-By ibex
    default_backend be

# Cleartext HTTP/2.
frontend fe_h2c
    bind 127.0.0.1:@P_H2C@ proto h2
    http-request set-header X-Trained yes
    http-response set-header X-Served-By ibex
    default_backend be

backend be
    server s1 127.0.0.1:@P_BE@

backend be_down
    server dead 127.0.0.1:@P_DEAD@ disabled
