# VV-14: a typo in a typed converter argument (letter O for zero) disables this deny rule on Alcyon
# (config loads, GET from 127.0.0.1 -> 200); HAProxy refuses the config. Fixed mask: both 403.
global
    nbthread 1
defaults
    mode http
    timeout client 1s
    timeout server 1s
    timeout connect 1s
frontend f
    bind 127.0.0.1:19899
    http-request deny if { src,ipmask(255.255.255.O) -m ip 127.0.0.0/8 }
    http-request return status 200 content-type text/plain string allowed
