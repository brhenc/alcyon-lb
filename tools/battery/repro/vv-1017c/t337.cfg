# T337 check config, used by t337.sh (@P@/@BE@ replaced)
global
    nbthread 1
defaults
    mode http
    timeout client 2s
    timeout server 2s
    timeout connect 1s
frontend f
    bind 127.0.0.1:@P@
    acl xb hdr(x) -m str b
    acl xfa req.fhdr(x) -m str "a, b"
    acl ca2 cook(a) -m str 1
    acl pa2 url_param(a) -m str 2
    http-request return status 200 content-type text/plain lf-string "hdr=[%[hdr(x)]] fhdr=[%[req.fhdr(x)]] hdr1=[%[hdr(x,1)]] hdrm1=[%[hdr(x,-1)]] cook=[%[cook(a)]] cookcnt=[%[cook_cnt(a)]] up=[%[url_param(a)]] upsemi=[%[url_param(a,;)]] upi=[%[url_param(A,,i)]]\n" if !{ path_beg /resp } !{ path_beg /acl }
    http-request return status 200 content-type text/plain lf-string "xb\n" if { path_beg /acl } xb
    http-request return status 200 content-type text/plain lf-string "xfa\n" if { path_beg /acl } xfa
    http-request return status 200 content-type text/plain lf-string "ca2\n" if { path_beg /acl } ca2
    http-request return status 200 content-type text/plain lf-string "pa2\n" if { path_beg /acl } pa2
    http-request return status 200 content-type text/plain lf-string "none\n" if { path_beg /acl }
    http-response set-header Y "reshdr=[%[res.hdr(x)]] resfhdr=[%[res.fhdr(x)]] rescook=[%[res.cook(a)]] rescookb=[%[res.cook(b)]] rescookcnt=[%[res.cook_cnt(a)]]"
    default_backend b
backend b
    server s 127.0.0.1:@BE@
frontend fb
    bind 127.0.0.1:@BE@
    http-request return status 200 content-type text/plain hdr X "a, b" hdr X "c" hdr Set-Cookie "a=1; Path=/" hdr Set-Cookie "a=\"x\\\"y;z\"; Path=/" hdr Set-Cookie "b=\"q;r\"" string ok
