# libFuzzer (cargo-fuzz) targets. A separate crate, outside the workspace: libFuzzer links
# only into the binaries here, never into Alcyon. Run from this directory:
#   cargo +nightly fuzz run <target>      (see ../README.md)
[package]
name = "alcyon-libfuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
alcyon-proto = { path = "../../crates/alcyon-proto" }
alcyon-config = { path = "../../crates/alcyon-config" }
alcyon-sample = { path = "../../crates/alcyon-sample" }
alcyon-regex = { path = "../../crates/alcyon-regex" }
alcyon-rt = { path = "../../crates/alcyon-rt" }
alcyon-sched = { path = "../../crates/alcyon-sched" }

[[bin]]
name = "h1_request"
path = "fuzz_targets/h1_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_response"
path = "fuzz_targets/h1_response.rs"
test = false
doc = false
bench = false

