# libFuzzer (cargo-fuzz) targets. A separate crate, outside the workspace: libFuzzer links
# only into the binaries here, never into Ibex. Run from this directory:
#   cargo +nightly fuzz run <target>      (see ../README.md)
[package]
name = "ibex-libfuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ibex-proto = { path = "../../crates/ibex-proto" }
ibex-config = { path = "../../crates/ibex-config" }
ibex-sample = { path = "../../crates/ibex-sample" }
ibex-regex = { path = "../../crates/ibex-regex" }
ibex-rt = { path = "../../crates/ibex-rt" }

[[bin]]
name = "h1_request"
path = "fuzz_targets/h1_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_response"
path = "fuzz_targets/h1_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_frames"
path = "fuzz_targets/h2_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack"
path = "fuzz_targets/hpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_protocol"
path = "fuzz_targets/proxy_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logfmt"
path = "fuzz_targets/logfmt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sample_expr"
path = "fuzz_targets/sample_expr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regex"
path = "fuzz_targets/regex.rs"
test = false
doc = false
bench = false

