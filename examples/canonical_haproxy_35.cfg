# Canonical HAProxy 3.5 Modern Configuration for Project Alcyon
# Target: Production-ready L4-L7 HTTP/HTTPS edge reverse proxy

global
    nbthread 4
    stats socket /tmp/alcyon.sock mode 660 level admin

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 60s
    log global

# Shared stick-table for L4 connection tracking and L7 request rate limiting
backend st_rate_limit
    stick-table type ipv6 size 1m expire 10m store conn_cnt,conn_rate(10s),http_req_cnt,http_req_rate(10s),http_err_rate(10s)

frontend fe_main
    bind 0.0.0.0:8443 ssl crt /etc/alcyon/certs/ alpn h2,http/1.1 accept-proxy
    bind [::]:8443 ssl crt /etc/alcyon/certs/ alpn h2,http/1.1 accept-proxy
    
    # L4 Connection Security & Rate Limiting
    tcp-request connection track-sc0 src table st_rate_limit
    tcp-request connection silent-drop if { sc_conn_rate(0) gt 100 }
    
    # L7 Request Pipeline & Synthetic Responses
    http-request track-sc0 src table st_rate_limit
    http-request return status 200 content-type "text/plain" lf-string "OK\n" if { path /healthz }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 50 }
    
    # Header Manipulation & Client Metadata
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Client-IP %ci
    
    # Conditional Switching Rules & Default Fallback
    use_backend be_api if { path_beg /api/ }
    use_backend be_static if { path_beg /static/ }
    default_backend be_default

backend be_default
    balance roundrobin
    default-server check inter 2s fall 3 rise 2 send-proxy-v2 maxconn 1000
    
    server app-01 10.0.1.10:8080 weight 100
    server app-02 10.0.1.11:8080 weight 100
    server app-backup 10.0.1.99:8080 backup
    
    # L7 Response Security Headers & Latency Tagging
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-after-response set-header X-Response-Time %Tr

backend be_api
    balance roundrobin
    default-server check inter 2s fall 3 rise 2
    server api-01 10.0.2.10:8080 weight 100
    server api-02 10.0.2.11:8080 weight 100

backend be_static
    balance roundrobin
    default-server check inter 2s fall 3 rise 2
    server static-01 10.0.3.10:8080 weight 100
    server static-02 10.0.3.11:8080 weight 100

# Modern Web Stats & Administration Dashboard
listen stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE
