# Reference configuration for Ibex TLS termination proxying to Nginx
global
    maxconn 10000

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_https
    bind 127.0.0.1:8443 ssl crt examples/certs/localhost.pem alpn http/1.1
    default_backend be_nginx

backend be_nginx
    mode http
    server nginx01 127.0.0.1:8080
