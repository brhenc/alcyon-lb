# Sample HAProxy-compatible configuration for Ibex
global
    maxconn 100000

frontend http_in
    bind 0.0.0.0:8080
    mode http
    acl is_api path_beg /api/
    acl is_static path_beg /static/
    use_backend api_cluster if is_api
    use_backend static_cluster if is_static
    default_backend web_cluster

backend api_cluster
    mode http
    balance roundrobin
    server api1 127.0.0.1:8001 check
    server api2 127.0.0.1:8002 check

backend static_cluster
    mode http
    balance leastconn
    server cdn1 127.0.0.1:9001 check

backend web_cluster
    mode http
    balance roundrobin
    server web1 127.0.0.1:8081 check

peers cluster_sync
    peer lb1 127.0.0.1:1024
    peer lb2 127.0.0.1:1025
