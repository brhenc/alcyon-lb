# Alcyon Modern Stats Dashboard Standalone Configuration

global
    maxconn 100000
    stats socket /tmp/alcyon.sock mode 660 level admin

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Dedicated modern Web Admin & Stats Dashboard
listen stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE

# Demo frontend/backends to showcase live metrics
frontend http_front
    bind 0.0.0.0:8080
    mode http
    stats enable
    stats uri /stats
    default_backend web_cluster

backend web_cluster
    mode http
    balance roundrobin
    server app01 127.0.0.1:8001 check weight 100
    server app02 127.0.0.1:8002 check weight 100
    server app_backup 127.0.0.1:8099 check backup weight 50
