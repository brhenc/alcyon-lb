# Ibex / HAProxy configuration for a personal website.
# Accepted by `ibex -c` and by `haproxy -c` (3.5-dev8). See docs/rc1-quickstart.md.
#
# Paths to change: the certificate (crt), the backend address, the stats socket directory.
# For a trial run on one machine, change :443 and :80 to high ports (:8443, :8080).

global
    maxconn 2000
    # A personal site does not need a thread per core; raise it if the CPU is ever the limit.
    nbthread 2
    # /run/ibex is created by the unit (RuntimeDirectory=ibex).
    stats socket /run/ibex/admin.sock mode 600 level admin
    # Access log to stdout: the journal under systemd. Use "log 127.0.0.1:514 local0"
    # for a syslog daemon.
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    maxconn 1500
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout queue 10s

frontend www_http
    bind :80
    # Everything on plain HTTP goes to https. Keep ACME http-01 here if you use it.
    http-request redirect scheme https code 301

frontend www_https
    # One PEM file: certificate chain, then private key. alpn h2 enables HTTP/2.
    bind :443 ssl crt /etc/ibex/certs/site.pem alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000"
    http-response set-header X-Content-Type-Options nosniff

    # Prometheus scrape, reachable from this host only.
    acl metrics_path path /metrics
    acl from_localhost src 127.0.0.1 ::1
    http-request use-service prometheus-exporter if metrics_path from_localhost
    http-request deny deny_status 403 if metrics_path

    default_backend site

backend site
    # Your web server (nginx, a static file server, an application) on this host.
    server web1 127.0.0.1:8081 check
