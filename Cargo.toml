[workspace]
resolver = "2"
members = [
    "crates/ebtree",
    "crates/ibex-sched",
    "crates/ibex-proto",
    "crates/ibex-rt",
    "crates/ibex-config",
    "crates/ibex-sample",
    "crates/ibex-regex",
    "crates/ibex-crypt",
    "crates/ibex-stick-table",
    "crates/ibex-tls",
    "crates/ibex-alloc",
    "crates/ibex-h1-sys", "crates/slz", "crates/ibex-mmsg", "crates/ibex-dns", "crates/ibex-quic",
]
# T460: the vendored ring fork and its rustls provider are dependencies, not members: `cargo test
# --workspace` and clippy do not run ring's suite or lint upstream code (vendor/README.md).
exclude = ["vendor/ringibex", "vendor/rustls-ringibex", "vendor/quinn-proto"]

# T542: quinn-proto vendored and patched here (vendor/README.md); every user in the graph takes it.
[patch.crates-io]
quinn-proto = { path = "vendor/quinn-proto" }


[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Willy Tarreau and HAProxy contributors"]
license = "GPL-2.0-or-later"
repository = "https://github.com/project-ibex/ibex"
rust-version = "1.80.0"

[workspace.dependencies]
# Internal workspace crates
ibex-alloc = { path = "crates/ibex-alloc" }
ibex-core = { path = "crates/ibex-core" }
ebtree = { path = "crates/ebtree" }
ibex-stick-table = { path = "crates/ibex-stick-table" }
ibex-peers = { path = "crates/ibex-peers" }
ibex-parser = { path = "crates/ibex-parser" }
ibex-tls = { path = "crates/ibex-tls" }
ibex-config = { path = "crates/ibex-config" }
ibex-vtest = { path = "crates/ibex-vtest" }
ibex-runtime = { path = "crates/ibex-runtime" }

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
bytes = "1.7"
memchr = "2.7"
arc-swap = "1.7"
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"

# Parsing & Serialization
nom = "7.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
fancy-regex = "0.19"
ibex-regex = { path = "crates/ibex-regex" }


# TLS & Cryptography
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = "0.26"
# T440: the TCP TLS path (ibex-tls transport, ibex-rt xprt) on the 0.24 pre-release, whose
# connections decrypt and encrypt in buffers the caller owns. QUIC (quinn-proto 0.11) and the test
# clients stay on 0.23 above. Pinned exactly: a pre-release (tradeoff.md 6.21).
rustls24 = { package = "rustls", version = "=0.24.0-dev.2", default-features = false, features = ["webpki"] }
rustls24-ring = { package = "rustls-ring", version = "=0.24.0-dev.2" }
# T460: `tune.ibex.crypto-provider ring-ibex`: the zeroizing ring fork (vendor/README.md). Its own
# `links` value and C symbol prefix, so it links next to upstream ring.
rustls24-ringibex = { package = "rustls-ringibex", path = "vendor/rustls-ringibex" }

# CLI & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

# Testing & Verification
proptest = "1.5"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"
dead_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Soft-realtime & NASA safety rules
panic = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.livepatch]
inherits = "release"
lto = "off"

[profile.release]
debug = true

# Opt-in build for deployment and performance work: `cargo build --profile release-perf`
# (output in target/release-perf/). Fat LTO over the whole crate graph and one codegen unit:
# measured 2026-10-19 (T433) -9.1% user cycles and -5.1% CPU per proxied request against
# `release`, and a stable code layout (16 codegen units moved CPU/request by +-3% between
# near-identical builds). Costs a ~7 min cold build on 64 cores; `release` stays the default.
[profile.release-perf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Debug builds (and the tests) keep line tables only: backtraces still name the function and
# the line, but the ~350 test binaries are half the size and link several times faster
# (measured 2026-10-10: 26 GB -> 13-14 GB per target; with mold, relinking every test after a
# change to ibex-rt costs ~180 s of CPU instead of ~1,140 s). Coverage is unaffected: it
# comes from the instrumentation, not the debug info.
[profile.dev]
debug = "line-tables-only"

# Password hashing is deliberately slow; keep debug builds (tests) usable.
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.sha-crypt]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.ibex-crypt]
opt-level = 3

# `ibex_alloc::wipe` runs on every released buffer; at opt-level 0 its volatile stores cost
# ~0.3 ms per 16 KB and stalled the h2 upload test (T437 5b).
[profile.dev.package.ibex-alloc]
opt-level = 3
