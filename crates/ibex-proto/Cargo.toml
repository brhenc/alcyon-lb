[package]
name = "ibex-proto"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Ibex layer model: protocol / transport / mux vtables and the stream endpoint pivot"
autotests = false

[dependencies]
ibex-sched = { path = "../ibex-sched" }
ibex-regex = { workspace = true }
ibex-h1-sys = { path = "../ibex-h1-sys", optional = true }

[features]
haproxy-ffi = ["dep:ibex-h1-sys"]

[dev-dependencies]
proptest = { workspace = true }
ibex-alloc = { path = "../ibex-alloc" }
ibex-sample = { path = "../ibex-sample" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

# One integration-test binary (T260): tests/it/main.rs declares each test file as a module.
[[test]]
name = "it"
path = "tests/it/main.rs"

# Own process: installs a counting #[global_allocator] and asserts on the test process's allocations
[[test]]
name = "htx_allocation"
path = "tests/htx_allocation.rs"
