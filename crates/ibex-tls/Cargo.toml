[package]
name = "ibex-tls"
version = "0.1.0"
edition = "2021"
authors = ["Willy Tarreau and HAProxy contributors"]
license = "GPL-2.0-or-later"
description = "Pure memory-safe TLS transport and SNI resolver for Project Ibex"
autotests = false

[dependencies]
ibex-alloc = { workspace = true }
ibex-proto = { path = "../ibex-proto" }
ibex-sched = { path = "../ibex-sched" }
ebtree = { path = "../ebtree" }
rustls = { workspace = true }
tracing = { workspace = true }
rustix = { version = "0.38", features = ["event", "net", "std"] }
rustls-pemfile = "2.2.0"
ibex-config = { path = "../ibex-config" }
ibex-crypt = { path = "../ibex-crypt" }

[dev-dependencies]
# Test-only: the e2e harness drives a reference TLS endpoint. Nothing in src/ uses
# tokio, and it must not become a real dependency -- see design/README.md D1.
# Pinned to the same provider as `rustls` above. With default features it
# enables aws-lc-rs, which makes the process-level provider ambiguous for
# every crate in the graph, not just this one.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio = { workspace = true, features = ["full"] }
rcgen = "0.13"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_macros = "deny"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# One integration-test binary (T260): tests/it/main.rs declares each test file as a module.
[[test]]
name = "it"
path = "tests/it/main.rs"

# Own process: installs a process-wide default rustls CryptoProvider, which every other test in a shared binary would see
[[test]]
name = "server_verify"
path = "tests/server_verify.rs"
