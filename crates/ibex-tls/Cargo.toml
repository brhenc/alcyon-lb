[package]
name = "ibex-tls"
version = "0.1.0"
edition = "2021"
authors = ["Ibex contributors"]
license = "GPL-2.0-or-later"
description = "Pure memory-safe TLS transport and SNI resolver for Project Ibex"

[dependencies]
ibex-proto = { path = "../ibex-proto" }
ibex-sched = { path = "../ibex-sched" }
ebtree = { path = "../ebtree" }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros"] }
tracing = { workspace = true }
rustix = { version = "0.38", features = ["event", "net", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
rcgen = "0.13"
ibex-config = { path = "../ibex-config" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
