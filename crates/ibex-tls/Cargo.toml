[package]
name = "ibex-tls"
version = "0.1.0"
edition = "2021"
authors = ["Willy Tarreau and HAProxy contributors"]
license = "GPL-2.0-or-later"
description = "Pure memory-safe TLS transport and SNI resolver for Project Ibex"
autotests = false

[dependencies]
ibex-alloc = { workspace = true }
ibex-proto = { path = "../ibex-proto" }
ibex-sched = { path = "../ibex-sched" }
ebtree = { path = "../ebtree" }
rustls24 = { workspace = true }
rustls24-ring = { workspace = true }
rustls24-ringibex = { workspace = true }
tracing = { workspace = true }
rustix = { version = "0.38", features = ["event", "net", "std"] }
rustls-pemfile = "2.2.0"
ibex-config = { path = "../ibex-config" }
ibex-crypt = { path = "../ibex-crypt" }

[dev-dependencies]
# Test-only (T479): an independent TLS client for the server's split API (`tests/it/tcp_ctx.rs`).
# Nothing in src/ uses rustls 0.23; the binary links rustls 0.24 only.
rustls = { workspace = true }
rcgen = "0.13"
tempfile = "3"
# T507: RLIMIT_DATA for tests/mem_limit.rs.
rustix = { version = "0.38", features = ["process"] }
# T462: `ibex_alloc::stack_probe` for the stack scrub test (reads below the stack pointer).
ibex-alloc = { workspace = true, features = ["test-probe"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_macros = "deny"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# One integration-test binary (T260): tests/it/main.rs declares each test file as a module.
[[test]]
name = "it"
path = "tests/it/main.rs"

# Its own process: it lowers RLIMIT_DATA, which is process-wide and cannot be undone for the other tests (AGENTS.md section 6).
[[test]]
name = "mem_limit"
path = "tests/mem_limit.rs"
