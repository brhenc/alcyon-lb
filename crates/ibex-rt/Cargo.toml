[package]
name = "ibex-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ibex runtime: thread-per-core poller, listeners, and the accept path"

[dependencies]
ibex-sched = { path = "../ibex-sched" }
ibex-proto = { path = "../ibex-proto" }
ibex-config = { path = "../ibex-config" }
ibex-sample = { path = "../ibex-sample" }
ibex-tls = { path = "../ibex-tls" }
ibex-alloc = { workspace = true }
rustls = { workspace = true }
ibex-stick-table = { path = "../ibex-stick-table" }
rustix = { version = "0.38", features = ["event", "net", "fs", "process", "std", "time"] }
ibex-mmsg = { path = "../ibex-mmsg" }
ibex-quic = { path = "../ibex-quic" }
ctrlc = "3.5.2"
nix = { version = "0.31", default-features = false, features = ["net"] }
ibex-regex = { workspace = true }
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
