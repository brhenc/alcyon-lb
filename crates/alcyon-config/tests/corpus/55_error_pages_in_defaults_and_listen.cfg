defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s
    errorfile 503 /dev/null
    http-error status 403 content-type text/plain string no

listen li
    bind 127.0.0.1:8081
    errorfile 403 /dev/null
    http-error status 429 content-type text/plain string slow
