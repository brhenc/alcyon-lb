defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s

frontend fe
    bind 127.0.0.1:8080
    default_backend be

backend be
    http-request deny deny_status 200 if { path /200 }
    http-request deny deny_status 400 if { path /400 }
    http-request deny deny_status 401 if { path /401 }
    http-request deny deny_status 403 if { path /403 }
    http-request deny deny_status 404 if { path /404 }
    http-request deny deny_status 405 if { path /405 }
    http-request deny deny_status 407 if { path /407 }
    http-request deny deny_status 408 if { path /408 }
    http-request deny deny_status 410 if { path /410 }
    http-request deny deny_status 413 if { path /413 }
    http-request deny deny_status 414 if { path /414 }
    http-request deny deny_status 421 if { path /421 }
    http-request deny deny_status 422 if { path /422 }
    http-request deny deny_status 425 if { path /425 }
    http-request deny deny_status 429 if { path /429 }
    http-request deny deny_status 431 if { path /431 }
    http-request deny deny_status 500 if { path /500 }
    http-request deny deny_status 501 if { path /501 }
    http-request deny deny_status 502 if { path /502 }
    http-request deny deny_status 503 if { path /503 }
    http-request deny deny_status 504 if { path /504 }
    http-request deny deny_status 418 content-type text/plain string teapot if { path /418 }
