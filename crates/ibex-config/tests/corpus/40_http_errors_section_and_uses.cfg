defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s

http-errors site
    errorfile 503 /dev/null
    errorfile 403 /dev/null

frontend fe
    bind 127.0.0.1:8080
    errorfiles site
    errorfiles site 403 503
    http-error status 503 default-errorfiles
    http-error status 403 errorfiles site
    http-error status 429 content-type text/plain hdr X-A b string slow
    http-request deny deny_status 403 errorfiles site if { path /a }
    http-request deny deny_status 403 errorfile /dev/null if { path /b }
    http-request return status 200 content-type text/plain file /dev/null if { path /c }
    http-request return status 200 content-type text/plain lf-file /dev/null if { path /d }
    default_backend be

backend be
    errorfile 403 /dev/null
