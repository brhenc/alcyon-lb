[package]
name = "ibex-config"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "HAProxy 1.0 configuration parser for Ibex"

[dependencies]
ibex-regex = { workspace = true }
ibex-crypt = { path = "../ibex-crypt" }
thiserror = "1.0"
# `getpwnam_r` / `getgrnam_r` for `user` and `group`, as HAProxy resolves them while parsing.
nix = { version = "0.31", default-features = false, features = ["user"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
