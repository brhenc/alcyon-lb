[package]
name = "alcyon-crypt"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "crypt(3) password hash verification in safe Rust ($1$, $5$, $6$, $2a$/$2b$/$2y$) for userlists"
autotests = false

[dependencies]
# SHA-256/SHA-512 crypt primitives (RustCrypto). No password-hash/mcf layer: the setting is
# parsed here, as glibc/libxcrypt parses it.
sha-crypt = { version = "0.6.0", default-features = false }
# Pure-Rust bcrypt (Keats/rust-bcrypt); verifies with a constant-time comparison.
bcrypt = { version = "0.19.3", default-features = false, features = ["alloc"] }
md-5 = "0.11.0"
subtle = "2.6.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# One integration-test binary (T260): tests/it/main.rs declares each test file as a module.
[[test]]
name = "it"
path = "tests/it/main.rs"
