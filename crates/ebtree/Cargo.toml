[package]
name = "ebtree"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Elastic binary trees: intrusive, allocation-free, O(key-width) ordered trees"
keywords = ["ebtree", "radix", "trie", "scheduler", "timer"]
categories = ["data-structures", "no-std"]

[dependencies]

[dev-dependencies]
proptest = "1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
