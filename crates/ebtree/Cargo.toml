[package]
name = "ebtree"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-only"
description = "Elastic binary trees: allocation-free, O(key-width) ordered trees. Port of Willy Tarreau's ebtree."
keywords = ["ebtree", "radix", "trie", "scheduler", "timer"]
categories = ["data-structures", "no-std"]

[dependencies]

[dev-dependencies]
proptest = "1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
