[package]
name = "ibex-alloc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Allocation counting oracle and fixed-size memory pools for Project Ibex"
autotests = false

[dependencies]
zeroize = "1"
# `headroom::thread_fits`: an anonymous mapping, probed and unmapped (T540 fix).
rustix = { version = "0.38", features = ["mm"] }

[features]
# Test-only (T462): `stack_probe`, which reads and paints the stack below the caller. Turned on by
# dev-dependencies only (ibex-tls); no shipped build enables it.
test-probe = []

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Own process: installs a counting #[global_allocator] and asserts on the test process's allocation counters
[[test]]
name = "thread_counters"
path = "tests/thread_counters.rs"

# Own process: installs a counting #[global_allocator] and sets the process-wide tune.ibex.zero-on-free
[[test]]
name = "zero_on_free"
path = "tests/zero_on_free.rs"
