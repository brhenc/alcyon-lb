[package]
name = "ibex-sched"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "HAProxy-style budgeted task scheduler: ebtree run queue, lazy timers, class budgets"
autotests = false

[dependencies]
ebtree = { path = "../ebtree" }
ibex-alloc = { workspace = true }

[dev-dependencies]
proptest = "1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# One integration-test binary (T260): tests/it/main.rs declares each test file as a module.
[[test]]
name = "it"
path = "tests/it/main.rs"

# Own binary (T465): a #[global_allocator] that fails this thread's allocations on demand.
[[test]]
name = "timer_alloc_failure"
path = "tests/timer_alloc_failure.rs"
